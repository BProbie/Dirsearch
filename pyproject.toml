[project]
name = "dirsearch"
version = "1.0"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "yarl~=1.24.2",
    "aiohttp~=3.14.1",
    "requests~=2.34.2",
    "fake-useragent~=2.2.0",
]